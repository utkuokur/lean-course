# ---- The root package, i.e. our course repo ----
name = "FormalisingMathematics2026"

# defaultTargets is what `lake build` in the terminal builds
# for this course, our library defined below is the only default target. 
defaultTargets = ["FormalisingMathematics2026"]

# ---- Settings that apply to every Lean file of the package ----
[leanOptions]
# display functions as `fun x ↦ x + 1` instead of `fun x => x + 1`
# mostly for the Infoview, messages, mouse hovers
pp.unicode.fun = true

# a name that was never introduced before causes an error,
# instead of silently creating a new variable
autoImplicit = false

# When relaxedAutoImplicit is false, only one-letter names like `x`, `α`, `n₁`
# may become automatic variables, but not long names like `Continous`.
# This only applies if autoImplicit is on. Here it is an extra safety measure. 
relaxedAutoImplicit = false

# The following line switches on Mathlib's style linters.
# the course files switch them off at the top
# `weak.` makes this setting conditional: it takes effect in files that import
# Mathlib, where the option exists, and is ignored in all other files
weak.linter.mathlibStandardSet = true

# ---- Dependencies ----
# For this course, the only direct dependency is Mathlib
[[require]]
name = "mathlib"
# version of mathlib to be used
rev = "v4.34.1" 
# the repo Lake downloads Mathlib from
git = "https://github.com/leanprover-community/mathlib4.git"

# ---- The course library ---- 
# The course library is the collection of all Lean files in the folder
# FormalisingMathematics2026.
[[lean_lib]]
name = "FormalisingMathematics2026"
# globs builds every course file on its own, because otherwise 
# name clashes prevent the root module from building
globs = ["FormalisingMathematics2026.+"]
